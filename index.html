<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Homework Reminder</title><style>body{font-family:Arial;background:#eaf3ff;padding:15px}.box{max-width:430px;margin:auto;background:white;padding:18px;border-radius:18px;box-shadow:0 4px 18px #999}h2{text-align:center;color:#1e3a8a}input,select,textarea,button{width:100%;padding:11px;margin:6px 0;border-radius:9px;border:1px solid #bbb;box-sizing:border-box}button{background:#2563eb;color:white;border:0;font-weight:bold}.task{background:#f8fafc;border-left:5px solid #2563eb;margin-top:10px;padding:10px;border-radius:10px}.del{background:#dc2626}.ok{background:#16a34a}.done{text-decoration:line-through;color:#777}</style></head><body><div class="box"><h2>📚 Homework Reminder</h2><select id="s"><option>Maths</option><option>Science</option><option>English</option><option>Social Studies</option><option>Hindi</option><option>Arabic</option><option>Other</option></select><textarea id="d" placeholder="Homework details"></textarea><input id="dt" type="date"><button onclick="add()">Add Homework</button><div id="list"></div></div><script>let t=JSON.parse(localStorage.hw||'[]');function save(){localStorage.hw=JSON.stringify(t)}function add(){if(!d.value||!dt.value)return alert('Enter homework and date');t.push({s:s.value,d:d.value,dt:dt.value,c:0});d.value='';dt.value='';save();show()}function done(i){t[i].c=!t[i].c;save();show()}function del(i){t.splice(i,1);save();show()}function show(){list.innerHTML=t.length?'':'<p style="text-align:center;color:#777">No homework added yet.</p>';t.forEach((x,i)=>list.innerHTML+=`<div class=task><b class=${x.c?'done':''}>${x.s}</b><p class=${x.c?'done':''}>${x.d}</p><p>Due: ${x.dt}</p><button class=ok onclick=done(${i})>${x.c?'Undo':'Completed'}</button><button class=del onclick=del(${i})>Delete</button></div>`)}show()</script></body></html>
